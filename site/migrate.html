<style>
:root{--blue-d:#040C18;--green:#77B72B;--ink:#0E1726;--grey:#EEF2EC;--line:#D9DFD6;--r:12px}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 Arial,system-ui,sans-serif;color:var(--ink);background:var(--grey)}
header{background:var(--blue-d);padding:12px 18px;border-bottom:4px solid var(--green)}header img{height:38px;display:block}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin-bottom:6px}.sub{color:#5E6B7C;font-size:.95rem}
.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:18px;margin-top:16px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--r)}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}.chk input{width:auto}
button{font:inherit;font-weight:700;border:0;border-radius:var(--r);padding:13px 18px;background:var(--green);color:var(--ink);cursor:pointer;margin-top:14px;width:100%}
button.o{background:#fff;border:1.5px solid var(--line)}button:disabled{opacity:.5}
#log{margin-top:14px;white-space:pre-wrap;font:14px/1.5 Menlo,monospace;background:#0A1424;color:#E6EDF5;border-radius:var(--r);padding:14px;min-height:60px}
</style>

<main>
<h1>Move to the new server</h1>
<p class="sub">One-time move of all jobs, clients, reviews and logins from Google to Cloudflare. The Google version keeps working until the website is switched over.</p>
<div class="card">
  <label for="oldurl">Old server (Google) address</label><input id="oldurl" value="https://script.google.com/macros/s/AKfycbwCTcL4AgWSMxXguH6Y35lXozA9YLL2K5qkeyeQqeIsMXiRwwbFVMYAM2kS3sioPczt/exec">
  <label for="newurl">New server (Cloudflare) address</label><input id="newurl" value="https://prj-api.patryk-forgiel.workers.dev" placeholder="https://prj-api.your-name.workers.dev">
  <button class="o" id="check" type="button">1. Check the new server</button>
</div>
<div class="card">
  <label for="em">Your admin email (same as in the admin panel)</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Your admin password</label><input id="pw" type="password" autocomplete="current-password">
  <label for="sk">Setup key (the SETUP_KEY you saved in Cloudflare)</label><input id="sk" type="password" autocomplete="off">
  <label class="chk"><input type="checkbox" id="rep"> Replace data already on the new server (only when moving again)</label>
  <button id="go" type="button">2. Move the data</button>
</div>
<div id="log" aria-live="polite">Ready.</div>
</main>
<script>
const $=id=>document.getElementById(id),log=t=>{$('log').textContent+='\n'+t};
const post=async(u,o)=>{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});return r.json()};
const clean=u=>u.trim().replace(/\/+$/,'');
$('check').onclick=async()=>{
  $('log').textContent='Checking the new server...';
  try{const r=await fetch(clean($('newurl').value)+'/health');const j=await r.json();log(j.ok?'OK: the new server answers.':'The new server answered, but not as expected.')}
  catch(e){log('Could not reach the new server. Check the address.')}
};
$('go').onclick=async()=>{
  const b=$('go');b.disabled=true;$('log').textContent='Starting...';
  try{
    const oldu=clean($('oldurl').value),newu=clean($('newurl').value),em=$('em').value.trim(),pw=$('pw').value;
    if(!newu||!em||!pw||!$('sk').value){log('Fill in all the boxes first.');b.disabled=false;return}
    log('1/4 Logging in to the old server...');
    const lg=await post(oldu,{action:'login',username:em,password:pw});
    if(!lg.ok){log('Old server: '+(lg.message||'login failed'));b.disabled=false;return}
    log('2/4 Reading all data from Google (this can take up to a minute)...');
    const ex=await post(oldu,{action:'admin_export',key:lg.token});
    if(!ex.ok){log('Old server: '+(ex.message||'export failed. Is the newest Google script deployed?'));b.disabled=false;return}
    const n=Object.keys(ex.sheets||{}).map(k=>k+': '+(ex.sheets[k].length-1)+' rows').join(', ');
    log('    Found '+n+'.');
    log('3/4 Saving into the new server...');
    const im=await post(newu,{action:'migrate_import',setupKey:$('sk').value,replace:$('rep').checked,data:ex});
    if(!im.ok){log('New server: '+(im.message||'import failed'));b.disabled=false;return}
    log('    Saved '+im.rows+' rows and '+im.settings+' settings.');
    log('4/4 Testing your login on the new server...');
    const t=await post(newu,{action:'login',username:em,password:pw});
    log(t.ok?'Done. Your login works on the new server. Next: test the admin panel on the new server.':'Data moved, but the login test failed: '+(t.message||''));
  }catch(e){log('Something went wrong: '+e.message)}
  b.disabled=false;
};
</script>
</body>
